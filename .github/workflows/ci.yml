name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checkout is the only thing that needs the token, so nothing else is granted.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Check module syntax
        run: find . -name '*.js' -not -path './node_modules/*' -exec node --check {} +
